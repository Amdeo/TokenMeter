name: Release

# Tag-driven release: push an annotated `v*` tag and this workflow runs the test
# suite, builds the universal app, ad-hoc signs it, writes the ZIP and its
# SHA-256 checksum, cuts a DMG, publishes the GitHub Release for that tag, and
# finally offers the ZIP to Sparkle by committing its entry into appcast.xml.
#
# There is no Developer ID and no notarization (the maintainer is not an Apple
# developer): the signature is ad-hoc, which is all Sparkle needs — its XPC
# services will not load out of an unsigned bundle. Gatekeeper still stops the
# first launch of a download, and that is unchanged. `scripts/package-release.sh`
# stays the local, hand-run packager. Re-run or repair a release with
# workflow_dispatch.
#
# VERSION is the single source of the version: the gates below reject a tag
# that disagrees with it and a version with no CHANGELOG entry, and
# `scripts/version.py` keeps the Xcode project in step with it.
#
#   git tag -a v0.2.0 -m "TokenMeter 0.2.0" && git push origin v0.2.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      # Everything downstream — the project file, the built bundle's
      # CFBundleShortVersionString, the release title and its notes — is read
      # from VERSION, so the tag has to agree with it before anything runs. The
      # version is exported to later steps here.
      - name: Tag and VERSION must agree
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          declared="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$RELEASE_TAG  VERSION=$declared"
          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $RELEASE_TAG does not match VERSION ($declared). Bump VERSION, commit, then re-tag."
            exit 1
          fi
          case "$declared" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::VERSION ($declared) is not a MAJOR.MINOR.PATCH version."; exit 1 ;;
          esac
          echo "VERSION=$declared" >> "$GITHUB_ENV"
      # Before anything is built or published, so a missing entry costs a re-tag
      # rather than a release whose notes went out wrong. The heading is
      # `## <version>` with an optional ` — <date>`; the version is matched
      # literally, not as a pattern. Entries are bilingual, so both language
      # markers have to be there — a release page missing one of them is wrong
      # in a way nobody notices until it is published.
      - name: The changelog has an entry for this version
        run: |
          set -euo pipefail
          escaped="$(printf '%s' "$VERSION" | sed 's/[.[\*^$]/\\&/g')"
          if ! grep -Eq "^## ${escaped}([[:space:]]|\$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' entry. Write it, commit, then re-tag."
            exit 1
          fi
          entry="$(awk -v heading="## $VERSION" '
            index($0, heading) == 1 && ($0 == heading || substr($0, length(heading) + 1) ~ /^[[:space:]]/) { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          for marker in '**中文**' '**English**'; do
            if ! printf '%s\n' "$entry" | grep -qxF "$marker"; then
              echo "::error::The $VERSION entry has no '$marker' section. Both are needed."
              exit 1
            fi
          done
      # The project file carries the version Xcode builds with; drift between it
      # and VERSION is caught here rather than shipped.
      - name: The project file agrees with VERSION
        run: python3 scripts/version.py --check
      - name: Select Xcode 26
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          case "$(xcodebuild -version)" in
            "Xcode 26."*) ;;
            *) echo "macos-26 must provide Xcode 26" >&2; exit 1 ;;
          esac
      - name: Run the test suite
        run: >-
          xcodebuild -project TokenMeter.xcodeproj -scheme TokenMeter
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          test CODE_SIGNING_ALLOWED=NO
      - name: Build the universal app
        id: build
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          xcodebuild -project TokenMeter.xcodeproj -scheme TokenMeter \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build/release-derived-data \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-
          app=build/release-derived-data/Build/Products/Release/TokenMeter.app
          built="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          if [ "$built" != "$VERSION" ]; then
            echo "built version $built does not match VERSION ($VERSION)" >&2
            exit 1
          fi
          lipo -archs "$app/Contents/MacOS/TokenMeter"
      # Sparkle's XPC services and its updater only load out of a bundle that
      # carries a signature, so the app cannot stay unsigned the way the build
      # leaves it. Inside out, deepest first: a signature seals everything
      # nested inside the bundle it covers, so signing the app first would be
      # invalidated by the next signature written under it. `codesign --deep`
      # would sign a bundle in one call, but Sparkle's XPC services and its
      # Updater.app are code identities of their own that have to carry
      # signatures of their own — which is exactly what the deep pass skips.
      #
      # Ad-hoc (`--sign -`) and nothing more: no Developer ID is involved, and
      # Gatekeeper still refuses the first launch of an unnotarized download.
      - name: Ad-hoc sign the app
        run: |
          set -euo pipefail
          app=build/release-derived-data/Build/Products/Release/TokenMeter.app
          framework="$app/Contents/Frameworks/Sparkle.framework"
          if [ ! -d "$framework" ]; then
            echo "::error::Sparkle.framework is not embedded in $app — updates would not install."
            exit 1
          fi

          # `-depth` walks a bundle's contents before the bundle itself, which is
          # the order the seals require; `-type d` keeps the framework's own
          # symlinks (Updater.app, Versions/Current) out of it, so each bundle is
          # signed once, through its real path.
          while IFS= read -r -d '' nested; do
            echo "signing ${nested#"$app"/}"
            codesign --force --sign - "$nested"
          done < <(find "$framework" -depth -type d \( -name '*.xpc' -o -name '*.app' \) -print0)

          codesign --force --sign - "$framework"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Package the ZIP and checksum
        run: |
          set -euo pipefail
          app=build/release-derived-data/Build/Products/Release/TokenMeter.app
          name="TokenMeter-${VERSION}-macos-universal"
          # The name is published here rather than spelled out again in the
          # steps below: the download URL written into appcast.xml has to name
          # the asset this step produced, and nothing downstream would notice a
          # typo until every installed copy failed to update.
          echo "ARCHIVE_NAME=$name" >> "$GITHUB_ENV"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/$name.zip"
          (cd dist && shasum -a 256 "$name.zip" > "$name.zip.sha256")
          ls -l dist
      # The disk image is the friendlier download of the two — it carries the
      # install hint (drag the app to Applications) that a zip cannot. The
      # script builds it headlessly: no Finder, no AppleScript, no temporary
      # mount, so a runner with no desktop session is all it needs.
      - name: Package the disk image
        run: |
          set -euo pipefail
          scripts/dmg.sh build/release-derived-data/Build/Products/Release/TokenMeter.app dist
          ls -l dist/*.dmg
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          # A version like 0.4.0-beta.1 is published as a pre-release, which
          # GitHub's "latest release" excludes.
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists; replacing its assets."
            gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 dist/*.dmg --clobber
            exit 0
          fi
          {
            echo "ad-hoc 签名的 universal 构建（arm64 + x86_64）：没有 Developer ID，也没有公证，首次打开仍会被 Gatekeeper 拦截，步骤见 README 的「安装 → 已发布版本」。附 zip（旁有同名 .sha256 可校验）与 DMG 两种下载。"
            echo
            # Release notes come from the CHANGELOG entry for this version — the
            # heading (`## <version>`, optionally with ` — <date>`) up to the next
            # `## ` heading. The entry's presence was checked before the build;
            # commit-generated notes are the fallback when it is missing anyway.
            awk -v heading="## $VERSION" '
              index($0, heading) == 1 && ($0 == heading || substr($0, length(heading) + 1) ~ /^[[:space:]]/) { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > dist/changelog.md
            if [ -s dist/changelog.md ]; then
              cat dist/changelog.md
            else
              gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body
            fi
          } > dist/notes.md
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 dist/*.dmg \
            --title "TokenMeter $VERSION" --notes-file dist/notes.md $prerelease
      # After publishing, because the feed points at the release's own asset —
      # committing it first would advertise a download that 404s.
      #
      # This is what makes updates install themselves. Sparkle refuses an
      # archive that is not signed by the private half of the key whose public
      # half is baked into the app, so the signature written into the feed here
      # is the whole trust story: it holds even though the app carries only an
      # ad-hoc signature and Apple has vouched for nothing.
      - name: Offer it to Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set — installed copies would never see this release."
            exit 1
          fi

          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$ARCHIVE_NAME.zip"

          # The build fetched Sparkle into this DerivedData, and the path is
          # spelled out here rather than left to the search inside
          # scripts/appcast.py: Xcode files the artifact under the package's
          # identity, and the archive is signed by the tool that came with the
          # Sparkle version this app was built against.
          if [ -z "${SIGN_UPDATE:-}" ]; then
            # No `-type f`: Xcode has placed this file both ways, and a symlink
            # resolves to the same tool.
            found="$(find build -path '*SourcePackages/artifacts/*/Sparkle/bin/sign_update' -print -quit || true)"
            if [ -z "$found" ] || [ ! -f "$found" ]; then
              echo "::error::Sparkle's sign_update is not under build/ — the ZIP cannot be signed."
              exit 1
            fi
            export SIGN_UPDATE="$PWD/$found"
          fi

          # The tag was checked out detached; the feed lives on main.
          git fetch origin main
          git checkout -B main origin/main

          scripts/appcast.py "$VERSION" "dist/$ARCHIVE_NAME.zip" "$url"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml

          # Staged first, and compared against the index rather than the working
          # tree: `git diff` only looks at *tracked* files, so on the very first
          # release — when the feed is brand new — it reported no change, the
          # step exited green, and nothing was ever committed. A step that
          # succeeds without doing its job is the worst kind.
          if git diff --cached --quiet -- appcast.xml; then
            echo "Feed already offers $VERSION."
          else
            git commit -m "Offer $VERSION to Sparkle"
            # The checkout deliberately keeps no credentials, so `origin` cannot
            # push. The token goes into the URL of this one command, where it is
            # masked in the log and never lands in .git/config.
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main:main
          fi

          # Read it back off the remote rather than trusting this step's own
          # exit code: what matters is the feed installed copies will fetch, and
          # a push that reported success is not the same thing as the version
          # being on it.
          git fetch origin main
          if ! git show FETCH_HEAD:appcast.xml | grep -qF "<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>"; then
            echo "::error::main's appcast.xml does not offer $VERSION — installed copies would never see it."
            exit 1
          fi
          echo "main's appcast.xml offers $VERSION."
